name: Link check

on:
  schedule:
    - cron: '0 6 * * 1'      # every Monday at 06:00 UTC
  workflow_dispatch:          # lets you run it by hand: Actions tab -> Link check -> Run workflow

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check links
        id: check
        run: python tools/check_links.py

      - name: Open or update an issue when links are broken
        if: steps.check.outputs.problems == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create link-check --color d73a4a --description "Broken links found by the weekly check" --force
          existing=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "Broken links found ($(date +%F))" --label link-check --body-file report.md
          fi

      - name: Close the issue when everything is fine again
        if: steps.check.outputs.problems == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label link-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "All links are fine again."
          done
